[server]
# Файловият наблюдател на Streamlit обхожда всички заредени модули (torch, scipy...) през
# бавния /mnt/c в WSL и блокира сървъра при всяко ново зареждане на библиотека.
# Цена: няма автоматично презареждане при промяна на файл - натисни R или рестартирай.
fileWatcherType = "none"

# Не пита за имейл при старт и не се опитва да отваря браузър (в WSL няма такъв).
# Адресът се отваря ръчно: http://localhost:8501
headless = true

[browser]
gatherUsageStats = false
